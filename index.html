<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דמו: מערכת התפעול של דניאל חסיד פרויקטים בחינוך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F6F4F9;--surface:#FFFFFF;--line:#E8E3EF;--line2:#EFEBF4;--ink:#2B2236;--body:#5D5468;--muted:#8C8597;--faint:#B9B2C3;
  --primary:#66308B;--primaryHover:#4E2370;--onPrimary:#FFFFFF;
  --lav:#F4EEF8;--lavLine:#E3D7EE;--lavText:#7A5596;
  --teal:#03769C;--tealDark:#025E7D;--tealSoft:#E4F2F7;--tealLine:#C6E3EE;--tealText:#3E7F96;
  --green:#2C7A55;--greenSoft:#E5F3EB;--greenLine:#C3E3D1;--greenText:#4F8E6E;
  --amber:#E0A100;--amberInk:#A86A12;--amberSoft:#FDF3E2;--amberLine:#F3E0BE;
  --red:#C2313B;--redDark:#8D1F26;--redSoft:#FCECEC;--redLine:#F6CFD1;
  --grey:#F1EFF4;--stage:#ECE6F2;--track:#F1ECF6;--chrome:#2B2236;--frame:#1E1A23;
  --c3:#A98BCB;--c4:#6DB6CF;--c5:#DCCFEA;--barP:#794999;--barT:#2287A8;--arcL:#C9A9DD;--arcG:#A9CDBB;
  --shadow:0 1px 2px rgba(43,34,54,.04),0 2px 10px rgba(43,34,54,.04);
  --pop:0 12px 32px rgba(43,34,54,.16),0 2px 6px rgba(43,34,54,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15121A;--surface:#201B27;--line:#342C3E;--line2:#2B2434;--ink:#F1ECF6;--body:#CDC4D7;--muted:#9E95AA;--faint:#6F667C;
    --primary:#8350AC;--primaryHover:#6C3D93;--lav:#2C2238;--lavLine:#3F3150;--lavText:#C9B2E0;
    --teal:#4FB2D3;--tealDark:#8FD3EA;--tealSoft:#15303A;--tealLine:#22495A;--tealText:#8FC6D8;
    --green:#5EC08D;--greenSoft:#16302A;--greenLine:#24493A;--greenText:#8CCFAA;
    --amber:#E8B230;--amberInk:#EBC06A;--amberSoft:#34290F;--amberLine:#4A3A14;
    --red:#EC727A;--redDark:#F2A2A7;--redSoft:#3A1D22;--redLine:#5A2A31;
    --grey:#2A2432;--stage:#110E15;--track:#2B2434;--chrome:#0C0A0F;--frame:#000000;
    --c3:#B79BD6;--c4:#7FC3DA;--c5:#4F4360;--barP:#9B6CC4;--barT:#3CA0C2;--arcL:#6D5584;--arcG:#3E6E57;
    --shadow:0 1px 2px rgba(0,0,0,.3);--pop:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15121A;--surface:#201B27;--line:#342C3E;--line2:#2B2434;--ink:#F1ECF6;--body:#CDC4D7;--muted:#9E95AA;--faint:#6F667C;
  --primary:#8350AC;--primaryHover:#6C3D93;--lav:#2C2238;--lavLine:#3F3150;--lavText:#C9B2E0;
  --teal:#4FB2D3;--tealDark:#8FD3EA;--tealSoft:#15303A;--tealLine:#22495A;--tealText:#8FC6D8;
  --green:#5EC08D;--greenSoft:#16302A;--greenLine:#24493A;--greenText:#8CCFAA;
  --amber:#E8B230;--amberInk:#EBC06A;--amberSoft:#34290F;--amberLine:#4A3A14;
  --red:#EC727A;--redDark:#F2A2A7;--redSoft:#3A1D22;--redLine:#5A2A31;
  --grey:#2A2432;--stage:#110E15;--track:#2B2434;--chrome:#0C0A0F;--frame:#000000;
  --c3:#B79BD6;--c4:#7FC3DA;--c5:#4F4360;--barP:#9B6CC4;--barT:#3CA0C2;--arcL:#6D5584;--arcG:#3E6E57;
  --shadow:0 1px 2px rgba(0,0,0,.3);--pop:0 12px 32px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--body);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;}
h1,h2,h3,h4{font-family:Rubik,Heebo,sans-serif;font-weight:600;color:var(--ink);margin:0;letter-spacing:-.01em;}
p{margin:0;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:0;padding:0;}
a{color:var(--teal);}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px;}
.ic{width:18px;height:18px;flex:none;stroke-width:1.8;}
i.ic{display:inline-block;}
.rb{font-family:Rubik,Heebo,sans-serif;font-variant-numeric:tabular-nums;}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;}
.muted{color:var(--muted);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* demo chrome */
.demobar{position:sticky;top:0;z-index:50;background:var(--chrome);color:#F6F4F9;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 18px;padding-top:calc(8px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));font-size:13px;}
.demobar .lbl{color:#B9B0C6;}
.demobar .lbl b{color:#F6F4F9;font-weight:600;}
.dseg{display:flex;background:rgba(255,255,255,.09);border-radius:10px;padding:3px;gap:2px;}
.dseg button{color:#B9B0C6;padding:5px 12px;border-radius:8px;font-weight:500;}
.dseg button[aria-pressed="true"]{background:#F6F4F9;color:#2B2236;}
.demobar .sp{flex:1;}
.dbtn{border:1px solid rgba(255,255,255,.2)!important;color:#F6F4F9;padding:5px 12px!important;border-radius:8px;}
.script{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 22px;}
.script h3{font-size:15px;}
.script ol{margin:6px 0 0;padding-inline-start:20px;display:grid;gap:4px;max-width:960px;}

/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;border:1px solid transparent;}
.btn .ic{width:17px;height:17px;}
.btn-p{background:var(--primary);color:var(--onPrimary);}
.btn-p:hover{background:var(--primaryHover);}
.btn-o{background:var(--surface);border-color:var(--line);color:var(--ink);}
.btn-o:hover{background:var(--bg);}
.btn-t{background:var(--teal);color:#fff;}
.btn-r{background:var(--red);color:#fff;height:32px;padding:0 14px;font-size:13.5px;border-radius:8px;}
.btn-dis,.btn[disabled]{background:var(--grey);color:var(--faint);border-color:transparent;cursor:not-allowed;}
.btn-sm{height:34px;padding:0 14px;font-size:13.5px;}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.pill .ic{width:14px;height:14px;}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.p-teal{background:var(--tealSoft);color:var(--tealDark);}
.p-red{background:var(--redSoft);color:var(--red);}
.p-green{background:var(--greenSoft);color:var(--green);}
.p-lav{background:var(--lav);color:var(--primary);}
.p-amber{background:var(--amberSoft);color:var(--amberInk);}
.p-grey{background:var(--grey);color:var(--muted);}
.p-pur{background:var(--primary);color:#fff;}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;font-family:Rubik,sans-serif;}
.av-t{background:var(--tealSoft);color:var(--tealDark);}
.av-p{background:var(--lav);color:var(--primary);}
.av-a{background:var(--amberSoft);color:var(--amberInk);}
.icobox{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;}
.icobox .ic{width:19px;height:19px;}
.ib-lav{background:var(--lav);color:var(--primary);}
.ib-teal{background:var(--tealSoft);color:var(--teal);}
.ib-amber{background:var(--amberSoft);color:var(--amberInk);}
.ib-red{background:var(--redSoft);color:var(--red);}
.ib-green{background:var(--greenSoft);color:var(--green);}
.ib-line{background:var(--surface);border:1px solid var(--line);color:var(--body);}

/* daniel shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100% - 46px);}
.side{background:var(--surface);border-inline-end:1px solid var(--line);position:sticky;top:46px;height:calc(100vh - 46px);display:flex;flex-direction:column;}
.side-scroll{flex:1;overflow:auto;padding-bottom:10px;}
.logo{display:block;padding:22px 0 18px;margin:0 14px;border-bottom:1px solid var(--line);text-align:center;}
.logo img{width:112px;height:auto;display:inline-block;}
.navg h4{font-family:Heebo,sans-serif;font-size:13px;font-weight:500;color:var(--muted);padding:16px 30px 6px;}
.nav{position:relative;display:flex;align-items:center;gap:12px;width:calc(100% - 28px);margin:2px 14px;padding:8px 14px;border-radius:10px;color:var(--ink);font-size:15px;text-align:start;}
.nav .ic{width:20px;height:20px;color:var(--body);}
.nav:hover{background:var(--bg);}
.nav[aria-current="page"]{background:var(--lav);color:var(--primary);font-weight:600;}
.nav[aria-current="page"] .ic{color:var(--primary);}
.nav[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--primary);}
.nav .bdg{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:999px;min-width:21px;height:21px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px;}
.me{display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);margin:0 0;}
.me .av{width:36px;height:36px;font-size:13.5px;}
.me b{display:block;color:var(--ink);font-size:14.5px;}
.me span{font-size:12.5px;color:var(--muted);}
.main{padding:28px 36px 56px;min-width:0;}
.wrap{max-width:1112px;margin:0 auto;display:grid;gap:22px;}
.phead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px;}
.phead h1{font-size:30px;line-height:1.2;}
.upd{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-top:6px;}
.upd .ic{width:14px;height:14px;}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;}
.seg button{height:32px;padding:0 16px;border-radius:9px;color:var(--body);font-weight:500;font-size:14px;}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;font-weight:600;}
.secthead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;}
.secthead h2{font-size:19px;}
.secthead span{color:var(--muted);font-size:13.5px;}

/* dashboard */
.banners{display:grid;gap:10px;}
.banner{display:flex;align-items:center;gap:14px;background:var(--redSoft);border:1px solid var(--redLine);border-inline-start:4px solid var(--red);border-radius:12px;padding:12px 18px;}
.banner>.ic{color:var(--red);width:21px;height:21px;}
.banner .bt{flex:1;min-width:0;}
.banner b{display:block;color:var(--redDark);font-size:15px;font-weight:600;}
.banner span{color:var(--redDark);font-size:13.5px;opacity:.9;}
.leads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
.lead{border-radius:16px;padding:16px 20px;border:1px solid;min-height:124px;display:flex;flex-direction:column;}
.lead .lt{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
.lead .lt .ic{width:19px;height:19px;}
.lead .ln{font-family:Rubik,sans-serif;font-weight:600;font-size:40px;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;}
.lead .ls{font-size:13px;}
.l-amber{background:var(--amberSoft);border-color:var(--amberLine);color:var(--amberInk);}
.l-teal{background:var(--tealSoft);border-color:var(--tealLine);color:var(--teal);} .l-teal .ln{color:var(--tealDark);} .l-teal .ls{color:var(--tealText);}
.l-lav{background:var(--lav);border-color:var(--lavLine);color:var(--primary);} .l-lav .ls{color:var(--lavText);}
.l-green{background:var(--greenSoft);border-color:var(--greenLine);color:var(--green);} .l-green .ls{color:var(--greenText);}
.l-solid{background:var(--primary);border-color:var(--primary);color:#fff;} .l-solid .ls{color:rgba(255,255,255,.82);}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;}
.metric{padding:16px 16px;}
.metric .mt{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--body);white-space:nowrap;}
.metric .mt .ic{width:16px;height:16px;color:var(--muted);}
.metric .mn{font-family:Rubik,sans-serif;font-weight:600;font-size:28px;color:var(--ink);margin-top:8px;line-height:1.2;font-variant-numeric:tabular-nums;}
.metric .mn small{font-size:19px;color:var(--muted);font-weight:500;}
.metric .ms{font-size:13px;color:var(--muted);margin-top:4px;}
.metric .ms b{color:var(--green);font-weight:600;}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.chart{padding:20px 22px 16px;display:flex;flex-direction:column;}
.chart h3{font-size:17px;}
.chart .cs{color:var(--muted);font-size:13.5px;margin-top:2px;}
.chart .cb{flex:1;display:flex;align-items:center;min-height:200px;padding:14px 0;}
.chart .cf{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line2);padding-top:12px;font-size:13.5px;color:var(--body);}
.chart .cf .ic{width:16px;height:16px;color:var(--teal);}
.donutrow{display:flex;align-items:center;gap:18px;width:100%;}
.donut{position:relative;width:138px;height:138px;flex:none;}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);}
.donut .dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
.donut .dc b{font-family:Rubik,sans-serif;font-size:27px;font-weight:600;color:var(--ink);line-height:1.1;}
.donut .dc span{font-size:12.5px;color:var(--muted);}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:0;}
.legend li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--body);}
.legend i{width:9px;height:9px;border-radius:50%;flex:none;}
.legend b{margin-inline-start:auto;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
.hbars{display:grid;gap:13px;width:100%;}
.hbar{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:12px;font-size:14px;}
.hbar .tr{height:12px;background:var(--track);border-radius:6px;overflow:hidden;display:flex;}
.hbar .fl{height:100%;background:var(--teal);border-radius:6px;}
.hbar b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:left;}
.vbars{display:flex;align-items:flex-end;gap:7px;width:100%;height:190px;border-bottom:1px solid var(--line2);padding-bottom:0;}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0;}
.vb b{font-size:13px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
.vb i{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;}
.vlabels{display:flex;gap:7px;width:100%;margin-top:6px;}
.vlabels span{flex:1;text-align:center;font-size:12.5px;color:var(--muted);white-space:nowrap;}
.vlabels span.on{color:var(--ink);font-weight:700;}
.vwrap{width:100%;}
.bottom{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;}
.listcard{padding:20px 22px 10px;}
.lch{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line2);}
.lch h3{font-size:19px;}
.lnk{color:var(--primary);font-weight:600;font-size:14px;}
.up{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line2);}
.up:last-child{border-bottom:0;}
.datebox{width:50px;height:50px;border-radius:10px;background:var(--lav);display:grid;place-content:center;text-align:center;flex:none;}
.datebox b{font-family:Rubik,sans-serif;color:var(--primary);font-size:20px;line-height:1.05;}
.datebox span{font-size:11.5px;color:var(--muted);}
.up .ut{flex:1;min-width:0;}
.up .ut b{display:block;color:var(--ink);font-size:15.5px;font-weight:600;}
.meta{display:flex;flex-wrap:nowrap;white-space:nowrap;align-items:center;gap:6px 12px;color:var(--muted);font-size:13.5px;}
.meta span{display:inline-flex;align-items:center;gap:5px;}
.meta .ic{width:14px;height:14px;}
.up .ug{display:flex;align-items:center;gap:8px;flex:none;max-width:200px;color:var(--body);font-size:14px;}
.up .us{flex:none;min-width:84px;display:flex;justify-content:flex-end;}
.al{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line2);}
.al:last-child{border-bottom:0;}
.al .at{flex:1;min-width:0;}
.al .at b{display:block;color:var(--ink);font-size:15px;font-weight:600;}
.al .at span{font-size:13px;color:var(--muted);}

/* event card */
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);}
.crumbs button{color:var(--muted);}
.crumbs b{color:var(--ink);font-weight:500;}
.crumbs .ic{width:14px;height:14px;}
.evhead{padding:24px 28px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;}
.evhead h1{font-size:30px;}
.evmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:10px;color:var(--body);font-size:14.5px;}
.evmeta>span{display:inline-flex;align-items:center;gap:6px;}
.evmeta .ic{width:17px;height:17px;}
.sync{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--greenSoft);color:var(--green);font-size:13px;font-weight:600;}
.sync .ic{width:14px;height:14px;}
.stsel{display:flex;align-items:center;gap:10px;}
.stsel label{color:var(--muted);font-size:14px;}
.selpill{position:relative;display:inline-flex;align-items:center;height:38px;border-radius:10px;background:var(--tealSoft);border:1px solid var(--tealLine);color:var(--tealDark);font-weight:600;}
.selpill select{appearance:none;-webkit-appearance:none;background:transparent;border:0;height:100%;padding:0 30px 0 32px;color:inherit;font-weight:600;font-size:14.5px;cursor:pointer;}
.selpill .dot{position:absolute;inset-inline-start:14px;width:8px;height:8px;border-radius:50%;background:currentColor;pointer-events:none;}
.selpill .ic{position:absolute;inset-inline-end:10px;width:16px;height:16px;pointer-events:none;}
.selpill.s-done{background:var(--greenSoft);border-color:var(--greenLine);color:var(--green);}
.selpill.s-cancel{background:var(--grey);border-color:var(--line);color:var(--muted);}
.evgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start;}
.col{display:grid;gap:16px;}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.pane{padding:20px 22px;}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.ph h3{font-size:18px;flex:1;}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 10px;font-size:14.5px;}
.kv dt{color:var(--muted);}
.kv dd{margin:0;color:var(--ink);font-weight:500;}
.kv a{color:var(--teal);font-weight:600;text-decoration:none;}
.maplink{display:inline-flex;align-items:center;gap:4px;color:var(--teal);font-weight:600;font-size:14px;}
.maplink .ic{width:15px;height:15px;}
.quote{display:flex;align-items:center;gap:12px;background:var(--lav);border-radius:12px;padding:14px 16px;margin-top:16px;width:100%;text-align:start;}
.quote .ic{color:var(--primary);}
.quote b{display:block;color:var(--primary);font-weight:600;font-size:15px;white-space:nowrap;}
.quote span{font-size:13px;color:var(--body);}
.quote .amt{margin-inline-start:auto;font-family:Rubik,sans-serif;font-weight:600;font-size:22px;color:var(--primary);}
.empty{text-align:center;display:grid;justify-items:center;gap:6px;}
.empty .icobox{width:52px;height:52px;border-radius:14px;margin-bottom:6px;}
.empty .icobox .ic{width:24px;height:24px;}
.empty b{color:var(--ink);font-size:15px;}
.empty span{font-size:13.5px;color:var(--muted);}
.inrow{display:flex;gap:10px;margin-top:14px;width:100%;}
.field{flex:1;display:flex;align-items:center;gap:8px;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--muted);}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--ink);font-size:14px;}
.field .ic{width:16px;height:16px;}
.inrow .btn{height:42px;}
.steps{display:flex;align-items:center;gap:8px;margin:2px 0 14px;}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);white-space:nowrap;}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);background:var(--surface);}
.step.on{color:var(--primary);font-weight:600;}
.step.on i{background:var(--primary);border-color:var(--primary);color:#fff;}
.step.done i{background:var(--lav);border-color:var(--lavLine);color:var(--primary);}
.steps .ln{flex:1;height:1.5px;background:var(--line);min-width:14px;}
.infobox{display:flex;gap:10px;background:var(--bg);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--body);}
.infobox .ic{width:16px;height:16px;color:var(--teal);margin-top:2px;}
.warnbox{display:flex;gap:10px;background:var(--redSoft);border:1px solid var(--redLine);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--redDark);}
.warnbox .ic{width:16px;height:16px;color:var(--red);margin-top:2px;}
.okbox{display:flex;gap:10px;align-items:center;background:var(--greenSoft);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--green);font-weight:500;}
.okbox .ic{width:16px;height:16px;}
.notes p{font-size:14.5px;color:var(--body);line-height:1.7;}
.notes small{display:block;color:var(--muted);font-size:12.5px;margin-top:8px;}
.notes textarea,.msgedit{width:100%;min-height:96px;border:1px solid var(--primary);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font-size:14.5px;line-height:1.6;resize:vertical;outline:0;}
.grow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;}
.grow .av{width:36px;height:36px;font-size:13.5px;}
.grow .gn{flex:1;min-width:0;}
.grow .gn b{display:block;color:var(--ink);font-size:15px;font-weight:600;}
.grow .gn span{font-size:13px;color:var(--muted);}
.grow.bad{background:var(--redSoft);border-color:var(--redLine);}
.grow .gw{display:flex;align-items:center;gap:6px;color:var(--red);font-size:13.5px;font-weight:500;}
.grow .gw .ic{width:16px;height:16px;}
.picker{border:1.5px dashed var(--lavLine);border-radius:14px;padding:14px;}
.picker>button{display:flex;align-items:center;gap:8px;color:var(--primary);font-weight:600;font-size:15px;width:100%;}
.picker>button .ic{width:18px;height:18px;}
.pbody{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:8px;}
.psearch{display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted);}
.psearch input{flex:1;border:0;background:transparent;outline:0;color:var(--ink);}
.psearch .ic{width:16px;height:16px;}
.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:10px 10px 6px;}
.popt{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:10px;text-align:start;}
.popt:hover,.popt.hi{background:var(--lav);}
.popt .av{width:34px;height:34px;}
.popt .gn{flex:1;min-width:0;}
.popt .gn b{display:block;color:var(--ink);font-size:15px;font-weight:600;}
.popt .gn span{font-size:13px;color:var(--muted);}
.popt .gn span.busy{color:var(--red);}
.popt[disabled]{cursor:not-allowed;}
.popt[disabled]:hover{background:transparent;}
.eqlegend{display:flex;gap:12px;font-size:12.5px;color:var(--muted);}
.eqlegend span{display:inline-flex;align-items:center;gap:5px;}
.eqlegend i{width:8px;height:8px;border-radius:50%;}
table{width:100%;border-collapse:collapse;}
th{font-weight:500;color:var(--muted);text-align:start;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);}
td{padding:11px 0;border-bottom:1px solid var(--line2);color:var(--ink);vertical-align:middle;font-size:15px;}
tr:last-child td{border-bottom:0;}
td small{display:block;font-size:12.5px;color:var(--muted);}
td small.r{color:var(--red);}
.qty{font-weight:700;font-variant-numeric:tabular-nums;width:70px;}
.stc{width:120px;}
.edc{width:40px;text-align:left;}
.iconbtn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);}
.iconbtn:hover{background:var(--bg);color:var(--ink);}
.iconbtn .ic{width:16px;height:16px;}
.mini{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 8px;}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;border:1.5px dashed var(--lavLine);border-radius:12px;height:46px;color:var(--primary);font-weight:600;font-size:15px;}
.addrow .ic{width:18px;height:18px;}
.drafts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.draft{padding:22px;display:flex;flex-direction:column;gap:14px;}
.dh{display:flex;align-items:center;gap:12px;}
.dh .icobox{width:38px;height:38px;border-radius:50%;}
.dh .dt{flex:1;min-width:0;}
.dh .dt b{display:block;color:var(--ink);font-size:16px;font-weight:600;}
.dh .dt span{font-size:13px;color:var(--muted);}
.msg{background:var(--tealSoft);border:1px solid var(--tealLine);border-radius:12px;padding:14px 16px;color:var(--ink);font-size:14.5px;line-height:1.7;white-space:pre-line;}
.msg.off{background:var(--bg);border-color:var(--line);color:var(--muted);}
.msg a{color:var(--teal);}
.dwarn{display:flex;align-items:center;gap:6px;color:var(--red);font-size:13.5px;font-weight:500;}
.dwarn .ic{width:16px;height:16px;}
.dfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.dfoot .when{margin-inline-start:auto;display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;}
.dfoot .when .ic{width:14px;height:14px;}
.dfoot .btn{height:40px;}

/* calendar */
.calhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.calhead h1{font-size:30px;}
.caltools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.sqbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--ink);}
.sqbtn .ic{width:17px;height:17px;}
.calmonth{font-family:Rubik,sans-serif;font-weight:600;font-size:21px;color:var(--ink);margin:0 4px;}
.dd{position:relative;display:inline-flex;align-items:center;gap:6px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;white-space:nowrap;color:var(--muted);font-size:14px;}
.dd .ic{width:16px;height:16px;}
.dd select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--ink);font-weight:600;font-size:14px;padding-inline-end:18px;cursor:pointer;field-sizing:content;max-width:170px;}
.dd .chev{position:absolute;inset-inline-end:10px;pointer-events:none;color:var(--ink);}
.clegend{display:flex;gap:10px;white-space:nowrap;font-size:13px;color:var(--body);margin-inline-start:auto;}
.clegend span{display:inline-flex;align-items:center;gap:6px;}
.clegend i{width:13px;height:11px;border-radius:3px;}
.calcard{overflow:hidden;}
.calscroll{overflow-x:auto;}
.cal{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));min-width:840px;}
.cal .dow{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);}
.cell{min-height:132px;border-top:1px solid var(--line2);border-inline-start:1px solid var(--line2);padding:10px;display:flex;flex-direction:column;gap:6px;}
.cal .cell:nth-child(7n+1){border-inline-start:0;}
.cal .dow+.cell,.cal .dow~.cell:nth-child(-n+14){border-top:0;}
.cell .dn{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);font-size:14px;height:26px;}
.cell.out .dn{color:var(--faint);}
.cell.out .chip{opacity:.5;}
.cell.today{background:var(--lav);}
.cell.today .dn b{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;}
.cell.today .dn span{color:var(--primary);font-size:13px;}
.chip{position:relative;display:block;width:100%;text-align:start;border-radius:6px;padding:5px 9px;border-inline-start:3px solid;}
.chip b{display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip>span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip.set{background:var(--tealSoft);border-color:var(--teal);}
.chip.done{background:var(--greenSoft);border-color:var(--green);}
.chip.cancel{background:var(--grey);border-color:var(--faint);}
.chip.cancel b{text-decoration:line-through;color:var(--muted);}
.chip.conf{outline:2px solid var(--red);outline-offset:-1px;border-radius:7px;padding-inline-end:24px;}
.chip .cw{position:absolute;inset-inline-end:6px;top:6px;color:var(--red);}
.chip .cw .ic{width:14px;height:14px;}
.week{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));min-width:840px;}
.week .cell{min-height:380px;}
.calsum{display:flex;flex-wrap:wrap;gap:22px;font-size:14px;color:var(--body);}
.calsum b{color:var(--ink);font-weight:700;margin-inline-end:4px;}
.calsum .r,.calsum .r b{color:var(--red);}
.hov{position:fixed;z-index:70;width:262px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:16px;pointer-events:none;display:none;}
.hov.on{display:block;}
.hov h4{font-size:15.5px;margin-bottom:8px;}
.hov .hr{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--body);margin-top:5px;}
.hov .hr .ic{width:15px;height:15px;color:var(--muted);margin-top:2px;}
.hov .warnbox{margin-top:10px;padding:9px 10px;font-size:12.5px;}
.hov .hl{border-top:1px solid var(--line2);margin-top:12px;padding-top:10px;color:var(--primary);font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px;}
.hov .hl .ic{width:14px;height:14px;}

/* other screens */
.tbl{overflow-x:auto;padding:6px 20px;}
.tbl td,.tbl th{padding-inline:8px;}
tr.click{cursor:pointer;}
tr.click:hover td{background:var(--bg);}
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
@media (max-width:900px){.gcards{grid-template-columns:1fr;}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.toolbar input,.toolbar select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;color:var(--ink);}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(30,26,35,.45);z-index:80;display:grid;place-items:center;padding:20px;}
.modal{background:var(--surface);border-radius:18px;width:min(780px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:24px;box-shadow:var(--pop);}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:16px;}
.fl label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:5px;}
.fl input,.fl select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;color:var(--ink);}
.checks{display:flex;flex-wrap:wrap;gap:8px;}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px;color:var(--ink);}

/* stage + phone */
.stage{background:var(--stage);min-height:calc(100vh - 46px);padding:34px 24px 48px;}
.stin{max-width:900px;margin:0 auto;}
.sthead{text-align:start;margin-bottom:26px;}
.sthead small{display:block;color:var(--primary);font-weight:700;font-size:14px;}
.sthead h1{font-size:26px;margin-top:4px;}
.phwrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.phcap{color:var(--body);font-size:14.5px;font-weight:500;}
.phone{width:402px;height:868px;background:var(--frame);border-radius:62px;padding:12px;box-shadow:0 24px 60px rgba(43,34,54,.22),0 2px 6px rgba(43,34,54,.1);}
.scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;}
.sbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0;direction:ltr;color:var(--ink);font-weight:700;font-size:16px;font-family:-apple-system,"SF Pro Text",Heebo,sans-serif;position:relative;}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;}
.sicons{display:flex;align-items:center;gap:6px;}
.sicons svg{fill:currentColor;}
.pbody2{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:12px 22px 24px;display:flex;flex-direction:column;}
.pbody2::-webkit-scrollbar{display:none;}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:5;pointer-events:none;}
.plogo{width:58px;align-self:flex-start;}
.phi{font-size:29px;margin-top:14px;}
.psub{font-size:15.5px;color:var(--body);margin-top:6px;}
.ptabs{display:grid;grid-template-columns:1fr 1fr;background:#E9E4F0;border-radius:15px;padding:5px;margin:20px 0 16px;}
:root[data-theme="dark"] .ptabs{background:var(--grey);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ptabs{background:var(--grey);}}
.ptabs button{height:42px;border-radius:11px;color:var(--body);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
.ptabs button[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:0 1px 4px rgba(43,34,54,.1);}
.ptabs .cnt{width:22px;height:22px;border-radius:50%;background:var(--lav);color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:700;}
.ecard{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px;margin-bottom:12px;text-align:start;}
.ecard.hl{box-shadow:0 8px 22px rgba(43,34,54,.1);border-color:var(--line2);}
.edate{width:60px;padding:8px 0;border-radius:14px;background:var(--lav);color:var(--primary);text-align:center;flex:none;}
.edate small{display:block;font-size:13px;color:var(--body);}
.edate b{display:block;font-family:Rubik,sans-serif;font-size:27px;font-weight:600;line-height:1.1;}
.edate span{display:block;font-size:12.5px;color:var(--body);}
.ecard.hl .edate{background:var(--primary);color:#fff;}
.ecard.hl .edate small,.ecard.hl .edate span{color:rgba(255,255,255,.88);}
.edate.past{background:var(--grey);color:var(--body);}
.ebody{flex:1;min-width:0;}
.ebody b{display:block;color:var(--ink);font-size:17.5px;font-weight:600;}
.ebody .et{font-size:15px;color:var(--body);margin-top:2px;}
.ebody .meta{margin-top:6px;font-size:14px;}
.ebody .pill{margin-top:9px;height:25px;font-size:13px;}
.echev{color:var(--faint);}
.echev .ic{width:18px;height:18px;}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-weight:500;font-size:16px;align-self:flex-start;min-height:40px;}
.back .ic{width:18px;height:18px;}
.bigd{font-family:Rubik,sans-serif;font-weight:600;color:var(--ink);font-size:30px;line-height:1.2;margin-top:8px;}
.bigt{font-family:Rubik,sans-serif;font-weight:500;color:var(--primary);font-size:36px;line-height:1.15;direction:ltr;text-align:right;}
.venue{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--body);font-size:15.5px;}
.venue .ic{width:18px;height:18px;}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:16px;}
.prow{display:flex;align-items:center;gap:12px;}
.prow+.prow{border-top:1px solid var(--line2);margin-top:14px;padding-top:14px;}
.prow .icobox{width:44px;height:44px;border-radius:12px;}
.prow .icobox .ic{width:21px;height:21px;}
.prow .pt{flex:1;min-width:0;}
.prow .pt b{display:block;color:var(--ink);font-size:16.5px;font-weight:600;}
.prow .pt span{font-size:13.5px;color:var(--muted);display:block;line-height:1.4;}
.prow .btn{height:46px;border-radius:12px;padding:0 16px;font-size:16px;}
.btn-call{background:var(--lav);color:var(--primary);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;}
.stats div+div{border-inline-start:1px solid var(--line);}
.stats span{display:block;color:var(--muted);font-size:14px;}
.stats b{display:block;color:var(--ink);font-size:16px;font-weight:700;margin-top:2px;}
.dnote{background:var(--lav);border-radius:18px;padding:16px 18px;margin-top:16px;}
.dnote h4{display:flex;align-items:center;gap:6px;color:var(--primary);font-family:Heebo,sans-serif;font-size:15px;font-weight:600;}
.dnote h4 .ic{width:17px;height:17px;}
.dnote p{color:var(--ink);font-size:15.5px;margin-top:6px;line-height:1.6;}
.eqlist .eh{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line2);}
.eqlist .eh b{color:var(--ink);font-size:16.5px;}
.eqlist .eh span{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);}
.eqlist .eh .ic{width:14px;height:14px;}
.eqlist li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2);font-size:16px;color:var(--ink);}
.eqlist ul{list-style:none;margin:0;padding:0;}
.eqlist li:last-child{border-bottom:0;}
.eqlist li span{color:var(--body);font-variant-numeric:tabular-nums;}
.stick{position:sticky;bottom:0;margin:auto -22px -24px;padding:14px 22px 26px;background:linear-gradient(to top,var(--bg) 70%,transparent);}
.cscr .stick{background:linear-gradient(to top,var(--surface) 70%,transparent);}
.bigbtn{width:100%;height:58px;border-radius:16px;font-size:17.5px;font-weight:700;}
.bigbtn .ic{width:22px;height:22px;}
.btn-p.bigbtn{box-shadow:0 10px 24px rgba(102,48,139,.28);}
.btn-ot{background:var(--surface);border:1.5px solid var(--tealLine);color:var(--teal);}
.sheetbg{position:absolute;inset:0;background:rgba(30,26,35,.45);z-index:20;display:flex;align-items:flex-end;}
.sheet{width:100%;background:var(--surface);border-radius:30px 30px 0 0;padding:12px 22px 34px;margin:0 10px 10px;border-radius:30px;}
.sheet .hdl{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px;}
.sheet h3{font-size:20px;}
.sheet p{color:var(--muted);font-size:14.5px;margin:4px 0 12px;}
.sopt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;border-top:1px solid var(--line2);text-decoration:none;color:var(--ink);font-weight:700;font-size:17px;}
.sopt .sq{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;}
.sopt .sq .ic{width:24px;height:24px;}
.sopt .ic.ch{margin-inline-start:auto;color:var(--faint);width:18px;height:18px;}
.sheet .cancel{width:100%;height:52px;border-radius:14px;background:var(--grey);color:var(--body);font-weight:700;font-size:16px;margin-top:16px;}
.ftitle{font-size:25px;margin-top:8px;}
.fdate{display:flex;align-items:center;gap:6px;color:var(--body);font-size:15px;margin-top:6px;}
.fdate .ic{width:16px;height:16px;}
.arcs{position:relative;width:280px;height:270px;margin:28px auto 4px;}
.arcs>svg{position:absolute;inset:0;width:100%;height:100%;}
.arcs .core{position:absolute;left:140px;top:125px;transform:translate(-50%,-50%);width:184px;height:184px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-family:Rubik,sans-serif;font-weight:600;font-size:21px;line-height:1.25;text-align:center;}
.arcs .core .ic{width:46px;height:46px;stroke-width:2.2;}
.core.pur{background:var(--primary);box-shadow:0 14px 34px rgba(102,48,139,.32),inset 0 -6px 0 rgba(0,0,0,.08);}
.core.grn{background:var(--green);box-shadow:0 14px 34px rgba(44,122,85,.3),inset 0 -6px 0 rgba(0,0,0,.08);cursor:default;}
.fcap{text-align:center;color:var(--muted);font-size:14.5px;max-width:240px;margin:0 auto;}
.fok{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--green);font-weight:700;font-size:15.5px;}
.fok .ic{width:18px;height:18px;}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;margin-bottom:8px;}
.lblrow b{color:var(--ink);font-size:16px;}
.lblrow span{color:var(--muted);font-size:14px;}
.ta{width:100%;min-height:100px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);color:var(--ink);font-size:16px;line-height:1.6;resize:none;outline:0;}
.ta:focus,.ta.foc{border-color:var(--primary);box-shadow:0 0 0 3px var(--lav);}
.hint{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-top:10px;justify-content:center;}
.hint .ic{width:15px;height:15px;}
/* client */
.cscr{background:var(--surface);}
.cscr .sbar{background:var(--bg);}
.urlbar{height:40px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;background:var(--bg);border-bottom:1px solid var(--line);color:var(--body);font-size:15px;direction:ltr;gap:6px;}
.urlbar .ic{width:14px;height:14px;}
.urlbar .x{position:absolute;left:18px;color:var(--muted);}
.urlbar .x .ic{width:18px;height:18px;}
.clogo{width:122px;margin:16px auto 0;display:block;}
.evbox{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:18px;padding:14px 16px;margin-top:20px;}
.evbox .icobox{background:var(--surface);color:var(--primary);width:42px;height:42px;border-radius:12px;}
.evbox b{display:block;color:var(--ink);font-size:16px;}
.evbox span{font-size:14px;color:var(--muted);}
.qh{text-align:center;font-size:31px;margin-top:42px;}
.qs{text-align:center;color:var(--body);font-size:15.5px;margin-top:6px;}
.starstage{position:relative;width:340px;max-width:100%;height:170px;margin:30px auto 0;}
.starstage svg.frame{position:absolute;inset:0;width:100%;height:100%;}
.starrow{position:absolute;left:0;right:0;top:28px;display:flex;justify-content:center;gap:4px;}
.starrow button{width:58px;height:58px;display:grid;place-items:center;color:var(--faint);border-radius:12px;}
.starrow svg{width:46px;height:46px;}
.starrow button.on{color:var(--amber);}
.starlbl{position:absolute;left:8px;right:8px;bottom:0;display:flex;justify-content:space-between;color:var(--muted);font-size:14px;}
.qnext{text-align:center;color:var(--body);font-size:15.5px;margin-top:22px;}
.ratedpill{display:table;margin:24px auto 0;background:var(--lav);color:var(--primary);font-weight:700;font-size:15px;padding:7px 18px;border-radius:999px;}
.prog{width:130px;height:4px;border-radius:2px;background:var(--line2);margin:14px auto 0;overflow:hidden;}
.prog i{display:block;height:100%;width:50%;background:var(--primary);margin-inline-start:auto;transition:width .8s ease;}
.prog i.full{width:100%;}
.cfoot{margin-top:auto;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.75;padding-top:20px;padding-bottom:16px;}
.cfoot span{display:inline-flex;align-items:center;gap:6px;}
.cfoot .ic{width:16px;height:16px;}
.sumbox{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:18px;padding:14px 18px;margin-top:20px;}
.sumbox .lb{font-size:15px;color:var(--body);}
.sumbox button{margin-inline-start:auto;display:inline-flex;align-items:center;gap:5px;color:var(--primary);font-weight:700;font-size:15px;}
.sumbox button .ic{width:16px;height:16px;}
.stars{display:inline-flex;gap:2px;color:var(--amber);}
.stars svg{width:22px;height:22px;}
.stars .off{color:var(--faint);}
.qh2{font-size:29px;margin-top:30px;line-height:1.25;}
.cta{min-height:200px;}
.sendnote{text-align:center;color:var(--muted);font-size:14.5px;margin-top:10px;}
.thx{display:flex;flex-direction:column;align-items:center;text-align:center;}
.tarcs{position:relative;width:200px;height:150px;margin-top:58px;}
.tarcs>svg{position:absolute;inset:0;width:100%;height:100%;}
.tarcs .tc{position:absolute;left:50%;top:62px;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;display:grid;place-items:center;color:#fff;}
.tarcs .tc .ic{width:40px;height:40px;stroke-width:2.4;}
.tc.g{background:var(--green);box-shadow:0 10px 26px rgba(44,122,85,.3);}
.tc.p{background:var(--primary);box-shadow:0 10px 26px rgba(102,48,139,.3);}
.tc.s{background:#8C8597;}
.thx h2{font-size:26px;margin-top:22px;}
.thx p{color:var(--body);font-size:15.5px;margin-top:10px;line-height:1.65;}
.tsum{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-top:22px;text-align:start;}
.tsum b{display:block;color:var(--ink);font-size:16px;}
.tsum div>span{font-size:14px;color:var(--muted);}
.tsum .stars{margin-inline-start:auto;}
.tsum .stars svg{width:19px;height:19px;}
.callback{display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--lav);border-radius:16px;padding:16px 18px;margin-top:16px;text-align:start;}
.callback .av{width:38px;height:38px;background:var(--primary);color:#fff;font-size:14px;}
.callback b{display:block;color:var(--ink);font-size:16px;}
.callback span{font-size:14.5px;color:var(--body);line-height:1.6;}
.morebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:1.5px solid var(--greenLine);border-radius:16px;color:var(--green);font-weight:700;font-size:15.5px;margin-top:16px;}
.morebtn .ic{width:18px;height:18px;}

.themebtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);flex:none;transition:background .15s;}
.themebtn:hover{background:var(--bg);}
.themebtn .ic{width:20px;height:20px;}
.utilrow{display:flex;justify-content:flex-end;margin-bottom:-8px;}
.sthead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.calsearch{display:inline-flex;align-items:center;gap:8px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;color:var(--muted);min-width:240px;}
.calsearch input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--ink);font-size:14px;}
.calsearch .ic{width:16px;height:16px;}
.calsearch:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--lav);}
.sres{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--body);}
.sres .pill{height:30px;cursor:pointer;font-size:13px;}
.chip.hit{box-shadow:0 0 0 2px var(--amber);}
.stick{pointer-events:none;}
.stick>*{pointer-events:auto;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row2 .bigbtn{font-size:16px;padding:0 10px;}
.newitem{padding:20px 22px;}
.newitem .fgrid{grid-template-columns:2fr 1.2fr 1fr;margin-top:6px;}
.gcity{display:inline-flex;align-items:center;gap:4px;}
.gcity .ic{width:14px;height:14px;}
:root[data-theme="dark"] .logo img,:root[data-theme="dark"] .plogo,:root[data-theme="dark"] .clogo{background:#F6F4F9;border-radius:14px;padding:6px 10px;}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--chrome);color:#F6F4F9;padding:11px 18px;border-radius:12px;z-index:90;font-weight:500;box-shadow:var(--pop);max-width:calc(100% - 32px);}
.toast[hidden]{display:none;}

@media (max-width:1200px){
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr));}
  .charts{grid-template-columns:repeat(2,minmax(0,1fr));}
  .leads{grid-template-columns:repeat(3,minmax(0,1fr));}
  .bottom,.evgrid,.drafts{grid-template-columns:1fr;}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .side{position:static;height:auto;flex-direction:row;border-inline-end:0;border-bottom:1px solid var(--line);}
  .side-scroll{display:flex;overflow-x:auto;padding:8px;}
  .side .logo,.side .me,.navg h4{display:none;}
  .navg{display:flex;flex:none;}
  .nav{width:auto;margin:0 2px;white-space:nowrap;}
  .nav[aria-current="page"]::before{display:none;}
  .main{padding:18px 14px 48px;}
  .charts,.two,.fgrid,.leads,.metrics{grid-template-columns:1fr;}
  .up{flex-wrap:wrap;}
  .up .ug,.up .us{width:auto;}
}
@media (max-width:480px){
  .stage{padding:0;}
  .sthead,.phcap{display:none;}
  .phone{width:100%;height:calc(100vh - 92px);border-radius:0;padding:0;box-shadow:none;background:transparent;}
  .scr{border-radius:0;}
  .sbar,.homebar{display:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

function alerts(){
 const A=[];const seen=new Set();
 live().filter(e=>diff(e.date)>=0).forEach(e=>clashes(e).forEach(c=>{
  const k=[e.id,c.o.id].sort().join()+c.g;if(seen.has(k))return;seen.add(k);
  const a=e.start<=c.o.start?e:c.o,b=a===e?c.o:e;

 }));

 D.events.filter(e=>diff(e.date)<0).forEach(e=>{const t=e.eq.filter(x=>x.s==='נלקח');if(t.length)A.push({k:'amber',i:'package',t:'ציוד שלא הוחזר',s:joinVe(t.map(x=>(x.q>1?x.q+' ':'')+x.n))+', מההפעלה ב־'+dm(e.date),go:e.id});});
 const gm=live().filter(e=>e.status==='נקבע'&&e.gmsg.st==='pending'&&e.guides.length);const sv=D.events.filter(e=>e.status==='בוצע'&&e.fb.st==='draft');
 const n=gm.length+sv.length;
 if(n){const parts=[];if(gm.length)parts.push(gm.length===1?'הודעה אחת למדריכים':gm.length+' הודעות למדריכים');if(sv.length)parts.push(sv.length===1?'סקר משוב אחד ללקוח':sv.length+' סקרי משוב ללקוחות');

 return A;

function calendar(){
 const q=S.calQ.trim();const hit=e=>q&&(e.title.includes(q)||e.name.includes(q)||e.city.includes(q));
 const fil=e=>(!q||hit(e))&&(S.calGuide==='all'||e.guides.some(x=>x.g===S.calGuide))&&(S.calType==='all'||e.type===S.calType);
 const chip=e=>{const cf=clashes(e).length>0;const c=e.status==='בוצע'?'done':e.status==='בוטל'?'cancel':'set';
  return '<button class="chip '+c+(cf?' conf':'')+(hit(e)?' hit':'')+'" data-a="open" data-v="'+e.id+'" data-hov="'+e.id+'">'+(cf?'<span class="cw">'+ic('triangle-alert')+'</span>':'')+'<b>'+esc(e.title)+'</b><span><span class="ltr">'+e.start+'</span> '+esc(gFirsts(e))+'</span></button>';};
 const evs=D.events.filter(fil).sort((a,b)=>a.start<b.start?-1:1);
 let grid,label;
 if(S.calView==='month'){
  const[y,m]=S.calM;const f=new Date(y,m,1);label=MON[m]+' '+y;
  const start=new Date(y,m,1-f.getDay());const weeks=Math.ceil((f.getDay()+new Date(y,m+1,0).getDate())/7);
  let cells='';for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);const t=s===TODAY;
   cells+='<div class="cell'+(d.getMonth()!==m?' out':'')+(t?' today':'')+'"><div class="dn"><b>'+d.getDate()+'</b>'+(t?'<span>היום</span>':'')+'</div>'+evs.filter(e=>e.date===s).map(chip).join('')+'</div>';}
  grid='<div class="cal">'+DOW.map(d=>'<div class="dow">'+d+'</div>').join('')+cells+'</div>';
 }else{
  const days=[...Array(7)].map((_,i)=>addD(S.calWeek,i));label='שבוע '+dm(days[0])+' עד '+dm(days[6]);
  grid='<div class="week">'+days.map(s=>'<div class="dow">'+DOW[pd(s).getDay()]+' '+dm(s)+'</div>').join('')+days.map(s=>'<div class="cell'+(s===TODAY?' today':'')+'">'+evs.filter(e=>e.date===s).map(chip).join('')+'</div>').join('')+'</div>';
 }
 const[y,m]=S.calM;const mon=D.events.filter(e=>pd(e.date).getMonth()===m&&pd(e.date).getFullYear()===y);
 const conf=new Set();mon.forEach(e=>clashes(e).forEach(c=>conf.add([e.id,c.o.id].sort().join())));
 return '<div class="phead"><div class="calhead"><h1>יומן הפעלות</h1><span class="sync">'+ic('refresh-cw')+'מסונכרן ל־Google Calendar</span><span class="muted" style="font-size:13.5px">'+'עודכן לפני 3 דקות'+'</span></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="calsearch">'+ic('search')+'<span class="sr">חיפוש לפי בית ספר</span><input type="search" data-c="calQ" value="'+esc(S.calQ)+'" placeholder="חיפוש לפי בית ספר"></label><button class="btn btn-p" data-a="newEvent">'+ic('plus')+'הפעלה חדשה</button></div></div>'+
 (q?(()=>{const res=D.events.filter(hit).sort((a,b)=>(a.date+a.start)<(b.date+b.start)?-1:1);return '<div class="sres">'+(res.length?'<span>נמצאו <b>'+res.length+'</b> הפעלות עבור "'+esc(q)+'":</span>'+res.map(e=>'<button class="pill '+(e.status==='בוצע'?'p-green':e.status==='בוטל'?'p-grey':'p-teal')+'" data-a="open" data-v="'+e.id+'">'+dm(e.date)+', '+esc(e.title)+'</button>').join(''):'<span>לא נמצאו הפעלות עבור "'+esc(q)+'". אפשר לחפש חלק מהשם, למשל "אופק".</span>')+'<button class="pill p-grey" data-a="calQx">'+ic('x')+'ניקוי</button></div>';})():'')+
 '<div class="caltools"><button class="sqbtn" data-a="calNext" aria-label="הבא">'+ic('chevron-left')+'</button><button class="sqbtn" data-a="calPrev" aria-label="הקודם">'+ic('chevron-right')+'</button><span class="calmonth">'+label+'</span><button class="btn btn-o" data-a="calToday">היום</button>'+
 '<div class="seg" role="group" aria-label="תצוגה"><button data-a="calView" data-v="month" aria-pressed="'+(S.calView==='month')+'">חודש</button><button data-a="calView" data-v="week" aria-pressed="'+(S.calView==='week')+'">שבוע</button></div>'+
 '<label class="dd">'+ic('user-check')+'מדריך:<select data-c="calGuide"><option value="all">כל המדריכים</option>'+GORDER.map(g=>'<option value="'+g+'"'+(S.calGuide===g?' selected':'')+'>'+G[g].name+'</option>').join('')+'</select>'+ic('chevron-down','chev')+'</label>'+
 '<label class="dd">'+ic('filter')+'סוג פעילות:<select data-c="calType"><option value="all">כל הסוגים</option>'+Object.keys(TY).map(k=>'<option value="'+k+'"'+(S.calType===k?' selected':'')+'>'+TY[k]+'</option>').join('')+'</select>'+ic('chevron-down','chev')+'</label>'+
 '<div class="clegend"><span><i style="background:var(--teal)"></i>נקבע</span><span><i style="background:var(--green)"></i>בוצע</span><span><i style="background:var(--faint)"></i>בוטל</span><span><i style="border:2px solid var(--red)"></i>התנגשות</span></div></div>'+

}

  case'albQ':S.albQ=el.value;break;
  case'm':S.modal[el.dataset.f]=el.value;if(el.dataset.f==='type')S.modal.eq=typeEq(el.value);if(['name','city','participants','classes'].includes(el.dataset.f))return;break;
  case'mEq':{const m=S.modal;m.eq=el.checked?m.eq.concat(el.value):m.eq.filter(x=>x!==el.value);return;}
  default:return;
 }
 render();
});
root.addEventListener('input',e=>{
 const el=e.target,c=el.dataset.c;if(!c)return;
 if(c==='gNote')S.g.note=el.value;
 if(c==='cText')S.c.text=el.value;
 if(c==='albumIn')S.albumIn=el.value;
 if(c==='niName')S.ni.n=el.value;
 if(c==='niQ')S.ni.q=el.value;
 if(c==='calQ'){S.calQ=el.value;const pos=el.selectionStart;render();const n=document.querySelector('[data-c="calQ"]');if(n){n.focus();n.setSelectionRange(pos,pos);}}
 if(c==='pickQ'){S.pickQ=el.value;const pos=el.selectionStart;render();const n=document.querySelector('[data-c="pickQ"]');if(n){n.focus();n.setSelectionRange(pos,pos);}}
 if(c==='noteText'){const E=ev(S.ev);E.notes={text:el.value,by:'דניאל',at:dm(TODAY)};}
 if(c==='gtext'){ev(S.ev).gtext=el.value;}
 if(c==='ctext'){ev(S.ev).ctext=el.value;}
 if(c==='m'&&['name','city','participants','classes'].includes(el.dataset.f))S.modal[el.dataset.f]=el.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=null;render();}else if(S.g.sheet){S.g.sheet=false;render();}}});
root.addEventListener('mouseover',e=>{
 const el=e.target.closest('[data-hov]');if(!el){hov.classList.remove('on');return;}
 const x=ev(el.dataset.hov);if(!x)return;hov.innerHTML=hovHTML(x);if(window.lucide)window.lucide.createIcons({attrs:{'stroke-width':1.8}});
 const r=el.getBoundingClientRect();let left=r.left-270;if(left<8)left=r.right+8;if(left+262>innerWidth-8)left=innerWidth-270;
 let top=r.top;const h=hov.offsetHeight||260;if(top+h>innerHeight-8)top=innerHeight-h-8;
 hov.style.left=left+'px';hov.style.top=Math.max(8,top)+'px';hov.classList.add('on');
});
window.addEventListener('scroll',()=>hov.classList.remove('on'),{passive:true});
reset();
})();
</script>
</body>
